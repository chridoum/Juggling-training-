<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Juglog</title>
  <meta name="description" content="Entraînement vidéo pour la jonglerie et les flow arts">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn back" id="backBtn" aria-label="Retour" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="pageTitle">Juglog</h1>
    <div class="topbar-actions" id="topActions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="fab-zone" id="fabZone"></div>

  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/entrainement" data-tab="train">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" class="fill"/></svg>
      <span>Entraînement</span>
    </a>
    <a href="#/journal" data-tab="journal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Journal</span>
    </a>
    <a href="#/ressources" data-tab="resources">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
      <span>Ressources</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
